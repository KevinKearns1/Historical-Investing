# Historical earnings announcement dates used by OP-04.
#
# 1999 dates are included because OP-04 requires at least THREE past events
# before it will size a trade -- it compares the implied move to the stock's
# own realized earnings-move history. Without a 1999 warm-up the strategy
# would be blind until late 2000.
#
# WHY THIS FILE IS STATIC
# -----------------------
# yfinance's earnings calendar returns only recent quarters. Pulling it into a
# 2000 simulation would be lookahead in its purest form. These dates are
# entered as data, and the loader treats any date it cannot verify as absent
# rather than guessing -- a missing earnings date means OP-04 simply does not
# trade that name, which is the safe failure.
#
# Populate from a period-correct source (company 8-Ks, press archives) before
# relying on OP-04's results. The dates below are the approximate historical
# reporting weeks for these names in 2000 and are marked as such.
